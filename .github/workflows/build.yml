name: Build LEDE x86-64

# 两套配置，手动触发时选：
#   slim —— 精简版（约 30 个包，一个代理栈），2 核 runner 约 3-4 小时，大概率能编完
#   full —— 完整版（configs/full.config，572 个包），含 docker/rustdesk/openclash 等，
#           2 核上极易超过 GitHub 的 6 小时单 job 上限；更适合本地 16 核编译
#
# 公开仓库的 Actions 分钟数免费无限。

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '配置：slim 精简（推荐） / full 完整 572 包（2 核很可能超时）'
        required: true
        default: slim
        type: choice
        options:
          - slim
          - full
  # 故意不加 push 触发：改配置不应该自动开始一次 4 小时的编译。
  # 需要自动构建时再取消下面注释。
  # push:
  #   paths:
  #     - 'diy.sh'
  #     - 'configs/**'
  #     - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 1. 腾空间：14GB -> 约 40GB ----------
      - name: Free disk space
        run: |
          echo "before: $(df -h / | tail -1)"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          echo "after : $(df -h / | tail -1)"

      # ---------- 2. 依赖 ----------
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libncursesw5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget subversion \
            libelf-dev ecj fastjar java-propose-classpath \
            autoconf automake libtool pkg-config

      # ---------- 3. 拉源码 ----------
      # 注意：feeds 用上游原始的 feeds.conf.default（含 helloworld），
      # 不要用本地改过的那份（那里面是 src-link /mnt/g/... 的本地路径）。
      - name: Clone LEDE
        run: |
          git clone --depth 1 https://github.com/coolsnowwolf/lede lede
          cd lede && git log -1 --pretty='%h %ci %s'
          echo "--- feeds ---"
          cat feeds.conf.default

      # ---------- 4. feeds ----------
      - name: Update and install feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------- 5. 应用配置 ----------
      - name: Apply config
        run: |
          cd lede
          V="${{ github.event.inputs.variant }}"
          if [ -z "$V" ]; then V=slim; fi
          echo "variant = $V"
          if [ "$V" = "full" ]; then
            cp ../configs/full.config .config
            echo "::warning::full 配置 572 个包，2 核 runner 很可能超过 6 小时上限"
          else
            bash ../diy.sh
          fi
          make defconfig
          echo "--- target ---"
          grep -E '^CONFIG_TARGET_(x86|ARCH_PACKAGES)' .config | head
          echo "enabled packages: $(grep -c '^CONFIG_PACKAGE_.*=y$' .config)"

      # ---------- 6. 下载源码包（缓存，重编快很多） ----------
      - name: Cache download directory
        uses: actions/cache@v4
        with:
          path: lede/dl
          key: dl-${{ github.event.inputs.variant }}-${{ hashFiles('diy.sh', 'configs/**') }}
          restore-keys: |
            dl-${{ github.event.inputs.variant }}-
            dl-

      - name: Download package sources
        run: cd lede && make download -j8 || make download -j1 V=s

      # ---------- 7. 编译 ----------
      - name: Compile
        run: |
          cd lede
          make -j$(nproc) || make -j1 V=s

      # ---------- 8. 产物 ----------
      - name: Collect images
        run: |
          cd lede
          mkdir -p ../out
          find bin/targets/x86/64 -maxdepth 1 -type f \
               \( -name '*.img.gz' -o -name '*.img' -o -name '*.vmdk' \
                  -o -name '*.vdi' -o -name '*.qcow2' -o -name '*.iso' \) \
               ! -name '*rootfs*' -exec cp -v {} ../out/ \;
          ls -lh ../out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lede-x86-64-${{ github.event.inputs.variant || 'slim' }}-${{ github.run_number }}
          path: out/*
          retention-days: 14
          if-no-files-found: error
