name: Build LEDE x86-64

# 说明：
#   - 公开仓库的 Actions 分钟数免费无限；私有仓库每月 2000 分钟，
#     一次 x86-64 全量编译在 2 核 runner 上约 150–250 分钟，很容易超。
#   - runner 只有 14GB 可用空间，OpenWrt 全量编译要 25GB+，
#     所以第一步必须把预装的 Android SDK / .NET / Haskell 之类删掉。
#   - 产物在 Actions 页面底部 Artifacts 里下载。

on:
  workflow_dispatch:          # 手动触发
  push:
    paths:
      - '.config'             # 改了配置自动重编
      - 'diy.sh'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350      # GitHub 单 job 上限 6 小时，留点余量

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 1. 腾空间：14GB -> 约 40GB ----------
      - name: Free disk space
        run: |
          echo "before: $(df -h / | tail -1)"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          echo "after : $(df -h / | tail -1)"

      # ---------- 2. 依赖 ----------
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libncursesw5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget subversion \
            libelf-dev ecj fastjar java-propose-classpath \
            autoconf automake libtool pkg-config

      # ---------- 3. 拉源码 ----------
      - name: Clone LEDE
        run: |
          git clone --depth 1 https://github.com/coolsnowwolf/lede lede
          cd lede && git log -1 --pretty='%h %ci %s'

      # ---------- 4. feeds ----------
      - name: Update and install feeds
        run: |
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------- 5. 应用 .config 与 diy.sh ----------
      - name: Apply config
        run: |
          cd lede
          if [ -f ../.config ]; then
            cp ../.config .config
            echo "using repo .config"
          else
            echo "no .config in repo -> make defconfig (x86-64 defaults)"
          fi
          if [ -f ../diy.sh ]; then
            cp ../diy.sh . && bash diy.sh || true
          fi
          make defconfig
          echo "--- target ---"
          grep -E '^CONFIG_TARGET_(x86|BOARD|SUBTARGET)' .config | head

      # ---------- 6. 下载源码包（可缓存，重编快很多） ----------
      - name: Cache download directory
        uses: actions/cache@v4
        with:
          path: lede/dl
          key: dl-${{ hashFiles('.config') }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ hashFiles('.config') }}-
            dl-

      - name: Download package sources
        run: cd lede && make download -j8 || make download -j1 V=s

      # ---------- 7. 编译 ----------
      - name: Compile
        run: |
          cd lede
          make -j$(nproc) || make -j1 V=s

      # ---------- 8. 产物 ----------
      - name: Collect images
        run: |
          cd lede
          mkdir -p ../out
          find bin/targets/x86/64 -maxdepth 1 -type f \
               \( -name '*.img.gz' -o -name '*.img' -o -name '*.vmdk' \
                  -o -name '*.vdi' -o -name '*.qcow2' -o -name '*.iso' \) \
               ! -name '*rootfs*' -exec cp -v {} ../out/ \;
          ls -lh ../out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lede-x86-64-${{ github.run_number }}
          path: out/*
          retention-days: 14
          if-no-files-found: error
